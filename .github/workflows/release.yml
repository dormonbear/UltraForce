name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    env:
      CWS_PUBLISH: ${{ secrets.CWS_PUBLISH_ENABLED }}
    steps:
      # Bootstrap only the Git graph. Inline guards remain available even when
      # a manually selected older tag predates the guards themselves.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Release Target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            TAG="$REQUESTED_TAG"
          elif [[ "$EVENT_NAME" == push && "$EVENT_REF" == refs/tags/* ]]; then
            TAG="${EVENT_REF#refs/tags/}"
          else
            echo 'Unsupported release event' >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected an existing vMAJOR.MINOR.PATCH release tag' >&2
            exit 1
          fi
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if [[ "$EVENT_NAME" == push && "$SHA" != "$EVENT_SHA" ]]; then
            echo 'Tag no longer points to the triggering commit' >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Release Commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Verify Release Source
        env:
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          if (pkg.version !== process.env.RELEASE_VERSION) {
            throw new Error('Release tag and package version differ')
          }
          NODE

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Unit Tests
        run: pnpm test:run

      - name: Build Cache Regressions / 构建缓存回归
        run: node --test scripts/build-cache.test.mjs

      - name: Build Extension
        run: pnpm build

      - name: Verify Built Version
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const manifest = JSON.parse(readFileSync('build/chrome-mv3-prod/manifest.json', 'utf8'))
          if (manifest.version !== process.env.RELEASE_VERSION) {
            throw new Error('Release tag and built manifest version differ')
          }
          NODE

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Package Extension
        run: pnpm package

      - name: Identify Package
        id: pkg
        run: |
          ZIP=build/chrome-mv3-prod.zip
          test -s "$ZIP"
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Verify Packaged Version
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
          ZIP_PATH: ${{ steps.pkg.outputs.zip_path }}
        run: |
          unzip -p "$ZIP_PATH" manifest.json > "$RUNNER_TEMP/release-manifest.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'
          const manifest = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'release-manifest.json'), 'utf8'))
          if (manifest.version !== process.env.RELEASE_VERSION) {
            throw new Error('Release tag and packaged manifest version differ')
          }
          NODE

      - name: Verify Packaged UI / 验证打包后的界面
        env:
          ZIP_PATH: ${{ steps.pkg.outputs.zip_path }}
        run: |
          ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/ultraforce-package.XXXXXX")
          trap 'rm -rf "$ARTIFACT_DIR"' EXIT
          unzip -q "$ZIP_PATH" -d "$ARTIFACT_DIR"
          EXTENSION_PATH="$ARTIFACT_DIR" node scripts/smoke-test.mjs

      - name: Extract Release Notes
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          node scripts/extract-release-notes.mjs "$RELEASE_VERSION" > "$RUNNER_TEMP/release-body.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          target_commitish: ${{ steps.target.outputs.sha }}
          name: ${{ steps.target.outputs.tag }}
          body_path: ${{ runner.temp }}/release-body.md
          files: ${{ steps.pkg.outputs.zip_path }}
          draft: false
          prerelease: false

      - name: Upload to Chrome Web Store
        if: env.CWS_PUBLISH == 'true'
        continue-on-error: true
        run: |
          echo '${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}' > /tmp/cws-key.json
          node scripts/cws-publish.mjs upload \
            --zip "${{ steps.pkg.outputs.zip_path }}" \
            --extension-id "${{ secrets.CWS_EXTENSION_ID }}" \
            --key /tmp/cws-key.json

      - name: Publish to Chrome Web Store
        if: env.CWS_PUBLISH == 'true'
        continue-on-error: true
        run: |
          node scripts/cws-publish.mjs publish \
            --extension-id "${{ secrets.CWS_EXTENSION_ID }}" \
            --key /tmp/cws-key.json
          rm -f /tmp/cws-key.json
