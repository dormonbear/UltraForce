name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm format:check

      - name: Type Check
        run: pnpm type-check

      - name: Release Workflow Tests
        run: node --test scripts/release-workflow.test.mjs

      - name: Chrome Web Store Publisher Regressions / Chrome 应用商店发布器回归
        run: node --test scripts/cws-publish.test.mjs

      - name: Dependency Target Contract / 依赖目标契约
        run: node --test scripts/dependabot-config.test.mjs

      - name: Build Cache Regressions / 构建缓存回归
        run: node --test scripts/build-cache.test.mjs

      - name: Manifest Policy Regressions / 清单策略回归
        run: node --test scripts/manifest-policy.test.mjs scripts/manifest-policy-build.test.mjs

      - name: YAML Configuration Regressions / YAML 配置回归
        run: node --test scripts/yaml-config.test.mjs

      - name: Build Input Regressions / 构建输入回归
        run: node --test scripts/build-inputs.test.mjs

      - name: PostCSS Source Map Regressions / PostCSS 源码映射回归
        run: node --test scripts/postcss-source-maps.test.mjs

      - name: Babel Build Input Regressions / Babel 构建输入回归
        run: node --test scripts/babel-build-inputs.test.mjs

      - name: Svelte Compiler and Parent Transformer Regressions / Svelte 编译器及父转换器回归
        run: node --test scripts/svelte-build-inputs.test.mjs

      - name: SVG Build Input Regressions / SVG 构建输入回归
        run: node --test scripts/svgo-build-inputs.test.mjs

      - name: Unused SVG Dependency Regressions / 未使用 SVG 依赖回归
        run: node --test scripts/deepmerge-unused-build.test.mjs

      - name: Vite Toolchain Compatibility / Vite 工具链兼容性
        run: node --test scripts/vite-toolchain.test.mjs

      - name: Immutable and Sass Regressions / Immutable 及 Sass 回归
        run: node --test scripts/immutable-build-inputs.test.mjs

      - name: Browserslist Build Regressions / Browserslist 构建回归
        run: node --test scripts/browserslist-build-inputs.test.mjs

      - name: Rollup Build Regressions / Rollup 构建回归
        run: node --test scripts/rollup-build-inputs.test.mjs

      - name: Sharp Native and Image Regressions / Sharp 原生库及图像回归
        run: node --test scripts/sharp-build-inputs.test.mjs

      - name: Vue Renderer and Parent Transformer Regressions / Vue 渲染器及父转换器回归
        run: node --test scripts/vue-renderer-build-inputs.test.mjs

      - name: HTTP Cache Revalidation Regressions / HTTP 缓存重新验证回归
        run: node --test scripts/http-cache-revalidation.test.mjs

      - name: E2E Command Regressions / E2E 命令回归
        run: node --test scripts/build-e2e.test.mjs

      - name: Git Checkout Newline Regressions / Git 检出换行回归
        run: node --test scripts/checkout-newlines.test.mjs

      - name: Audit Dependencies
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test:run --coverage

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  synthetic-browser:
    name: Synthetic Browser Tests / 合成浏览器测试
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium / 安装 Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Test Extension / 构建测试扩展
        run: pnpm build:e2e
      - name: Verify Locales and Privacy Boundaries / 验证语言及隐私边界
        run: >-
          xvfb-run --auto-servernum pnpm exec playwright test
          tests/e2e/localization.spec.ts tests/e2e/auth-boundary.spec.ts
          tests/e2e/privacy.spec.ts tests/e2e/setup-search-race.spec.ts
      - name: Upload Failure Evidence / 上传失败证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-results
          path: test-results/
          retention-days: 7

  windows-quality:
    name: Windows Quality and Coverage / Windows 质量及覆盖率
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint / 代码检查
        run: pnpm lint
      - name: Format Check / 格式检查
        run: pnpm format:check
      - name: Type Check / 类型检查
        run: pnpm type-check
      # Release Bash/zip contracts stay on Ubuntu; cross-platform library cases run here. / 发布 Bash／zip 契约保留 Ubuntu，跨平台库用例在此运行。
      - name: Cross-platform Dependency and Native Regressions / 跨平台依赖及原生库回归
        run: >-
          node --test scripts/build-e2e.test.mjs scripts/checkout-newlines.test.mjs scripts/dependabot-config.test.mjs
          scripts/build-cache.test.mjs scripts/manifest-policy.test.mjs scripts/manifest-policy-build.test.mjs
          scripts/yaml-config.test.mjs scripts/build-inputs.test.mjs scripts/postcss-source-maps.test.mjs
          scripts/svgo-build-inputs.test.mjs scripts/vite-toolchain.test.mjs scripts/immutable-build-inputs.test.mjs
          scripts/browserslist-build-inputs.test.mjs scripts/rollup-build-inputs.test.mjs
          scripts/sharp-build-inputs.test.mjs scripts/vue-renderer-build-inputs.test.mjs
          scripts/http-cache-revalidation.test.mjs
          scripts/babel-build-inputs.test.mjs
          scripts/svelte-build-inputs.test.mjs
          scripts/deepmerge-unused-build.test.mjs
      - name: Full Frontend Tests with Coverage / 全量前端测试及覆盖率
        run: pnpm test:run --coverage
      - name: Upload Windows Coverage / 上传 Windows 覆盖率
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-coverage-report
          path: coverage/
          retention-days: 14

  windows-synthetic-browser:
    name: Windows Synthetic Browser Tests / Windows 合成浏览器测试
    runs-on: windows-latest
    needs: [windows-quality]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium / 安装 Chromium
        run: pnpm exec playwright install chromium
      - name: Build Test Extension / 构建测试扩展
        run: pnpm build:e2e
      - name: Verify Locales and Privacy Boundaries / 验证语言及隐私边界
        run: >-
          pnpm exec playwright test tests/e2e/localization.spec.ts tests/e2e/auth-boundary.spec.ts
          tests/e2e/privacy.spec.ts tests/e2e/setup-search-race.spec.ts
      - name: Upload Windows Failure Evidence / 上传 Windows 失败证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-synthetic-browser-results
          path: test-results/
          retention-days: 7

  # Separate checkout prevents the E2E flag bundle entering production artifacts. / 独立检出防止 E2E 标志构建进入正式产物。
  windows-build:
    name: Windows Production Build / Windows 正式构建
    runs-on: windows-latest
    needs: [windows-quality]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Production Extension / 构建正式扩展
        run: pnpm build
      - name: Verify Managed Schema Shipped / 验证托管策略架构已打包
        run: node scripts/verify-managed-schema.mjs
      - name: Verify Bundled Fonts Shipped / 验证内置字体已打包
        run: node scripts/verify-fonts.mjs
      - name: Install Production Browser / 安装正式产物测试浏览器
        run: pnpm exec playwright install chromium
      - name: Verify Production UI / 验证正式产物界面
        run: node scripts/smoke-test.mjs
      - name: Package Production Extension / 打包正式扩展
        run: pnpm package
      - name: Upload Windows Production Artifact / 上传 Windows 正式产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-extension-build
          path: build/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-test]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Extension
        run: pnpm build

      - name: Verify Managed Schema Shipped
        run: node scripts/verify-managed-schema.mjs

      - name: Verify Bundled Fonts Shipped
        run: node scripts/verify-fonts.mjs

      - name: Install Production Browser / 安装正式产物测试浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Production UI / 验证正式产物界面
        run: node scripts/smoke-test.mjs

      - name: Package Extension
        run: pnpm package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: build/
          retention-days: 7
